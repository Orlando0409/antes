# Prueba de carga local (Lab 7, parte 3.2) contra UNA Chat en Docker.
# 5 usuarios nuevos por segundo durante 60 s, una solicitud cada uno = 300 solicitudes.
# Ejecutar: npx artillery run artillery/carga.yml --output reports/artillery-carga.json
config:
  target: "http://localhost:3000"
  phases:
    - name: carga-5-rps
      duration: 60
      arrivalRate: 5
  http:
    timeout: 10

scenarios:
  - name: enviar-mensaje
    flow:
      - post:
          url: "/api/mensajes"
          json:
            nombre: "artillery"
            mensaje: "mensaje de prueba de carga"
            color: "#3366FF"
          expect:
            - statusCode: 201
